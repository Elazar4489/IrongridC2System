services:
  broker:
    image: apache/kafka:latest
    container_name: broker
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list"]      
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
      start_interval: 5s

  db:
    image: mysql:8.4
    container_name: db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: testDb
    ports:
     - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "-uroot", "-proot","ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
      start_interval: 5s
    volumes:
      - ./db/seed.sql:/docker-entrypoint-initdb.d/seed.sql

  producer-irongrid-c2:
    build: 
      context: ./ProducerIrongridC2System
      dockerfile: Dockerfile
    container_name: irongrid-c2-producer
    #restart: on-failure
    depends_on:
      broker:
        condition: service_healthy
    environment:
      Kafka__BootstrapServers: broker:9092


  consumer-irongrid-c2:
    build:
      context: ./ConsumerIrongridC2System
      dockerfile: Dockerfile
    container_name: irongrid-c2-consumer
   # restart: on-failure
    depends_on:
      broker:
        condition: service_healthy
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__IrongridC2ConnectionString: Server=db;Database=IrongridC2SystemDB;User=root;Password=root;
      Kafka__BootstrapServers: broker:9092

  irongrid-c2-api:
    build:
      context: ./IrongridC2SystemAPI
      dockerfile: Dockerfile
    container_name: irongrid-c2-api
   # restart: on-failure
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__IrongridC2ConnectionString: Server=db;Database=IrongridC2SystemDB;User=root;Password=root;
volumes:
  mysqldata: